name: Build DENTYAR APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت پروژه
        uses: actions/checkout@v4

      - name: تنظیم Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: نصب وابستگی‌ها
        run: npm install

      - name: ایجاد پروژه Android
        run: npx cap add android

      - name: همگام‌سازی DENTYAR
        run: npx cap sync android

      - name: ساخت APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: ذخیره APK
        uses: actions/upload-artifact@v4
        with:
          name: DENTYAR-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
