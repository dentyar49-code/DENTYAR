<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DENTYAR — Your Smart Dental Assistant | V30</title>
<script>const DENTYAR_APP_VERSION = "V30";</script>
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DENTYAR">
<style>
  :root{
    --navy:#0f4f4f;
    --navy-dark:#0a3638;
    --turquoise:#149c9a;
    --turquoise-light:#e7f7f5;
    --gold:#c9a35b;
    --gold-dark:#9a7735;
    --gold-light:#f6efdf;
    --bg:#f5f7f6;
    --card:#fffdf9;
    --text:#17363a;
    --muted:#64777a;
    --danger:#b94d4d;
    --success:#2f8062;
    --border:#d9e5e2;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Vazirmatn","IRANSans",-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    direction:rtl;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior-y:none;
    font-size:13.5px;
    font-weight:500;
  }
  #app{min-height:100vh;}
  button, input, select, textarea{font-family:inherit;font-size:inherit;direction:rtl;}
  button{cursor:pointer;font-weight:700;}

  /* Fixed top block: identity bar + nav strip, height measured by JS and applied to #app padding-top */
  #fixedTop{position:fixed;top:0;right:0;left:0;z-index:600;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.06);}

  /* Premium symmetric identity bar: exit | DENTYAR brand | clinic identity */
  #topHeader{display:grid;grid-template-columns:86px minmax(190px,1fr) 86px;align-items:center;gap:8px;background:#fff;padding:8px 12px 10px;border-bottom:1px solid var(--border);direction:ltr;}
  #topHeader .headerSide{width:86px;height:96px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;justify-self:center;gap:4px;transform:translateY(10px);box-sizing:border-box;}
  #topHeader .appBrand{grid-column:2;grid-row:1;min-width:190px;text-align:center;direction:ltr;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  #topHeader .appLogo{width:82px;height:82px;object-fit:cover;border-radius:50%;display:block;background:#000;border:1px solid #d7e5ea;box-shadow:0 4px 14px rgba(18,59,93,.13);}
  #topHeader .appName{font-family:Arial,sans-serif;font-size:20px;line-height:1.05;font-weight:900;letter-spacing:.5px;color:var(--navy);margin-top:4px;}
  #topHeader .appSlogan{color:var(--gold-dark);font-size:11.5px;font-weight:800;line-height:1.25;white-space:nowrap;margin-top:2px;}
  #topHeader .clinicSide{grid-column:3;grid-row:1;direction:rtl;}
  #topHeader .clinicLogo{width:58px!important;height:58px!important;object-fit:cover!important;flex:0 0 58px;display:block;border-radius:50%;background:#fff;border:1px solid #d7e5ea;box-shadow:0 3px 10px rgba(18,59,93,.10);}
  #topHeader .clinicSideName{font-weight:900;font-size:14px;line-height:16px;height:16px;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px;text-align:center;margin-top:4px;}
  #topHeader .logoutLabel{font-weight:900;font-size:13px;line-height:16px;height:16px;color:var(--navy);white-space:nowrap;text-align:center;margin-top:4px;}
  #topHeader .logoutBtn{width:58px;height:58px;flex:0 0 58px;border-radius:50%;background:var(--danger);color:#fff;border:none;padding:0;margin:0;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(226,87,76,.24);}
  #topHeader .logoutBtn svg{width:25px;height:25px;}
  #topHeader .headerBalance{display:none;}
  @media(max-width:480px){#topHeader{grid-template-columns:74px minmax(0,1fr) 74px;gap:4px;padding:7px 12px 9px;}#topHeader .headerSide{width:66px;height:86px;transform:translateY(8px);}#topHeader .appBrand{min-width:0;}#topHeader .appLogo{width:72px;height:72px;}#topHeader .appName{font-size:18px;}#topHeader .appSlogan{font-size:9.5px;}#topHeader .clinicLogo{width:54px!important;height:54px!important;flex-basis:54px!important;}#topHeader .logoutBtn{width:54px;height:54px;flex-basis:54px;}#topHeader .clinicSideName{font-size:12.5px;max-width:92px;height:15px;line-height:15px;}#topHeader .logoutLabel{font-size:11.5px;height:15px;line-height:15px;}}


  /* Fixed horizontally-scrolling nav strip (constant height regardless of item count) */
  #bottomNav{
    display:flex;flex-wrap:nowrap;gap:6px;overflow-x:auto;
    background:#fff;padding:7px 10px;-webkit-overflow-scrolling:touch;
  }
  #bottomNav::-webkit-scrollbar{display:none;}
  .navItem{
    display:flex;align-items:center;gap:4px;flex:0 0 auto;white-space:nowrap;
    padding:6px 11px;border-radius:16px;border:1.5px solid var(--border);background:#fff;
    color:var(--navy);font-size:11px;font-weight:bold;
  }
  .navItem svg{width:13px;height:13px;stroke:var(--navy);fill:none;flex-shrink:0;}
  .navItem.active{background:var(--navy);border-color:var(--navy);color:#fff;}
  .navItem.active svg{stroke:#fff;}

  /* Layout helpers */
  .page{padding:10px;max-width:640px;margin:0 auto;}
  .card{background:var(--card);border-radius:12px;padding:10px;margin-bottom:9px;border:1px solid var(--border);}
  .card h3{margin:0 0 8px;font-size:13px;color:var(--navy);font-weight:700;}
  .row{display:flex;gap:8px;}
  .col{flex:1;min-width:0;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;}

  label{display:block;font-size:11px;color:var(--muted);margin:6px 0 3px;}
  input[type=text], input[type=number], input[type=date], input[type=time], input[type=tel], input[type=password], select, textarea{
    width:100%;padding:7px 9px;border:1px solid var(--border);border-radius:8px;background:#fbfcfd;color:var(--text);
  }
  input:focus, select:focus, textarea:focus{outline:2px solid var(--turquoise);outline-offset:0;border-color:var(--turquoise);}
  textarea{min-height:56px;resize:vertical;}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:8px 14px;border-radius:9px;border:none;font-weight:bold;font-size:12.5px;}
  .btn-primary{background:var(--turquoise);color:#fff;}
  .btn-primary:active{background:#128a8a;}
  .btn-gold{background:var(--gold);color:#fff;}
  .btn-navy{background:var(--navy);color:#fff;}
  .btn-outline{background:#fff;border:1.5px solid var(--turquoise);color:var(--turquoise);}
  .btn-danger{background:#fff;border:1.5px solid var(--danger);color:var(--danger);}
  .btn-block{width:100%;}
  .btn-sm{padding:5px 9px;font-size:11px;border-radius:7px;}
  .btn:disabled{opacity:.5;}

  .statGrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
  .statCard{
    border-radius:9px;padding:7px 6px;text-align:center;color:#fff;position:relative;overflow:hidden;
    display:flex;flex-direction:column;align-items:center;gap:3px;
  }
  .statCard .iconBadge{width:19px;height:19px;border-radius:6px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;}
  .statCard .iconBadge svg{width:10px;height:10px;stroke:#fff;fill:none;}
  .statCard .num{font-size:13.5px;font-weight:800;}
  .statCard .lbl{font-size:9px;opacity:.95;font-weight:600;}
  .statCard.clickable{cursor:pointer;}
  .statCard.clickable:active{transform:scale(.97);}
  .statCard.c-teal{background:linear-gradient(135deg,#16b3ad,#0e8f8a);}
  .statCard.c-navy{background:linear-gradient(135deg,#2f6fb0,#1a3c6e);}
  .statCard.c-gold{background:linear-gradient(135deg,#f0ad2e,#d6900f);}
  .statCard.c-green{background:linear-gradient(135deg,#3cb878,#25915c);}
  .statCard.c-red{background:linear-gradient(135deg,#e2574c,#c8362b);}
  .statCard.c-deepnavy{background:linear-gradient(135deg,#1c3f6e,#122a4d);}
  .statCard.c-purple{background:linear-gradient(135deg,#9163d4,#6f42b5);}

  table{width:100%;border-collapse:collapse;font-size:11.5px;}
  th,td{padding:6px 5px;text-align:right;border-bottom:1px solid var(--border);}
  th{color:var(--muted);font-weight:bold;background:#fafcfd;}
  tr:active{background:#f7fafa;}

  .searchBox{position:relative;margin-bottom:10px;}
  .searchBox input{padding-left:36px;}
  .searchBox svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted);}

  .fab{
    position:fixed;left:16px;bottom:18px;width:46px;height:46px;border-radius:50%;
    background:var(--turquoise);color:#fff;border:none;font-size:22px;box-shadow:0 4px 14px rgba(22,163,163,.4);
    z-index:400;display:flex;align-items:center;justify-content:center;
  }

  .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:bold;}
  .badge-success{background:#e3f6ee;color:var(--success);}
  .badge-danger{background:#fbe9e7;color:var(--danger);}
  .badge-muted{background:#eef2f4;color:var(--muted);}
  .badge-gold{background:var(--gold-light);color:#8a6d00;}

  .empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:13.5px;}

  /* Modal system (replaces native alert/confirm/prompt) */
  #modalOverlay{
    position:fixed;inset:0;background:rgba(7,27,48,.55);display:none;align-items:flex-end;justify-content:center;
    z-index:1000;
  }
  #modalOverlay.show{display:flex;}
  .modalBox{
    background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:480px;padding:14px;max-height:88vh;overflow-y:auto;
    animation:slideUp .18s ease-out;
  }
  @media(min-width:600px){
    #modalOverlay{align-items:center;}
    .modalBox{border-radius:18px;}
  }
  @keyframes slideUp{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .modalBox h3{margin:0 0 10px;color:var(--navy);}
  .modalBox .modalBtns{display:flex;gap:8px;margin-top:16px;}
  .modalBox .modalBtns .btn{flex:1;}

  /* Toast */
  #toast{
    position:fixed;bottom:16px;right:50%;transform:translateX(50%);
    background:var(--navy-dark);color:#fff;padding:9px 16px;border-radius:20px;font-size:12px;
    z-index:1200;opacity:0;pointer-events:none;transition:opacity .25s, bottom .25s;box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  #toast.show{opacity:1;bottom:22px;}

  /* Lock screen — light theme matching clinic branding */
  #lockScreen{
    position:fixed;inset:0;background:linear-gradient(180deg,#eef2f6,#e4ebf1);
    z-index:2000;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text);padding:20px;
    overflow-y:auto;
  }
  #lockScreen .lockLogo{width:80px;height:80px;margin-bottom:12px;}
  #lockScreen h2{margin:0 0 3px;color:var(--navy);font-size:16px;text-align:center;}
  #lockScreen .lockSlogan{color:var(--gold-dark);font-size:11px;font-weight:bold;margin:0 0 18px;text-align:center;}
  .pinDots{display:flex;gap:10px;margin-bottom:18px;}
  .pinDots span{width:10px;height:10px;border-radius:50%;border:2px solid var(--navy);background:transparent;}
  .pinDots span.filled{background:var(--navy);border-color:var(--navy);}
  .pinPad{display:grid;grid-template-columns:repeat(3,58px);gap:11px;}
  .pinPad button{
    width:58px;height:58px;border-radius:50%;background:#fff;border:1px solid var(--border);color:var(--navy);
    font-size:18px;font-weight:bold;box-shadow:0 2px 6px rgba(0,0,0,.06);
  }
  .pinPad button:active{background:#f2f5f8;}
  .pinPad button.unlockBtn{background:var(--success);color:#fff;box-shadow:0 3px 10px rgba(30,143,95,.4);}
  .pinPad button.clearBtn{background:none;box-shadow:none;border:none;color:var(--muted);font-size:14px;}
  #lockError{color:var(--danger);font-size:11.5px;height:15px;margin-top:8px;font-weight:bold;}
  #lockHint{color:var(--muted);font-size:10.5px;margin-top:14px;text-align:center;}

  .fileList{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
  .fileThumb{width:54px;height:54px;border-radius:9px;overflow:hidden;position:relative;border:1px solid var(--border);}
  .fileThumb img{width:100%;height:100%;object-fit:cover;}
  .fileThumb .rm{position:absolute;top:2px;left:2px;background:rgba(226,87,76,.9);color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:11px;line-height:1;}

  .filterChips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
  .chip{padding:5px 12px;border-radius:20px;background:#eef2f4;color:var(--muted);font-size:12px;border:1px solid transparent;}
  .chip.active{background:var(--turquoise-light);color:var(--turquoise);border-color:var(--turquoise);font-weight:bold;}

  .tabBar{display:flex;gap:6px;margin-bottom:12px;background:#eef2f4;border-radius:10px;padding:4px;}
  .tabBar button{flex:1;padding:8px;border:none;background:none;border-radius:8px;color:var(--muted);font-size:13px;}
  .tabBar button.active{background:#fff;color:var(--navy);font-weight:bold;box-shadow:0 1px 4px rgba(0,0,0,.08);}

  .sectionTitle{font-size:11px;color:var(--muted);margin:12px 0 6px;font-weight:bold;border-right:3px solid var(--gold);padding-right:7px;}
  hr{border:none;border-top:1px solid var(--border);margin:12px 0;}
  .kv{display:flex;justify-content:space-between;padding:6px 0;font-size:13.5px;border-bottom:1px dashed var(--border);}
  .kv b{color:var(--navy);}
  .costTag{color:var(--success);font-weight:bold;}
  #pfCost{direction:rtl;text-align:right;}
  .helpStep{display:flex;gap:10px;margin-bottom:14px;}
  .helpStep .num{width:26px;height:26px;border-radius:50%;background:var(--turquoise);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;}
  .iconCircle{width:44px;height:44px;border-radius:50%;background:var(--turquoise-light);display:flex;align-items:center;justify-content:center;margin:0 auto 10px;}
  .iconCircle svg{width:20px;height:20px;stroke:var(--turquoise);fill:none;}

  /* ===== DENTYAR premium dental identity ===== */
  :root{
    --navy:#0d5150; --navy-dark:#083638; --turquoise:#159f9a; --turquoise-light:#e5f6f3;
    --gold:#c7a15a; --gold-dark:#927038; --gold-light:#f5eddd;
    --bg:#f4f7f5; --card:#fffefa; --text:#17383b; --muted:#637679;
    --border:#d8e4e1; --radius:14px;
  }
  #lockScreen{background:radial-gradient(circle at 50% 18%,#ffffff 0,#f5fafb 38%,#eaf3f5 100%);}
  #lockScreen .lockLogo{width:92px;height:92px;object-fit:contain;filter:drop-shadow(0 7px 14px rgba(15,118,110,.14));animation:dentyarLogoIn .55s ease-out both, dentyarFloat 4s ease-in-out .7s infinite;}
  #lockScreen h2{font-size:21px;letter-spacing:.3px;margin-top:2px;}
  #lockScreen .lockSlogan{color:var(--turquoise);font-size:12px;margin-bottom:20px;}
  #lockScreen:before{content:'✦';position:absolute;top:12%;right:14%;font-size:18px;color:rgba(200,154,43,.38);animation:dentyarPulse 3s ease-in-out infinite;}
  #lockScreen:after{content:'✦';position:absolute;bottom:17%;left:14%;font-size:14px;color:rgba(15,143,138,.25);animation:dentyarPulse 3.4s ease-in-out .4s infinite;}
  .pinDots span{border-color:var(--turquoise);transition:all .16s ease;}
  .pinDots span.filled{background:var(--turquoise);border-color:var(--turquoise);transform:scale(1.08);}
  .pinPad button{transition:transform .14s ease,box-shadow .14s ease,background .14s ease;border-color:#d9e7ea;}
  .pinPad button:active{transform:scale(.94);}
  .pinPad button.unlockBtn{background:var(--turquoise);box-shadow:0 5px 16px rgba(15,143,138,.25);}
  .pinPad button.unlockBtn:hover{box-shadow:0 7px 20px rgba(15,143,138,.32);}
  .navItem,.btn,.card,.statCard,.chip{transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease;}
  .navItem.active{box-shadow:0 3px 10px rgba(18,59,93,.14);}
  .card{box-shadow:0 2px 10px rgba(18,59,93,.035);}
  .card:hover{box-shadow:0 5px 18px rgba(18,59,93,.07);}
  .statCard.clickable:active,.btn:active,.navItem:active{transform:scale(.98);}
  @keyframes dentyarLogoIn{from{opacity:0;transform:translateY(8px) scale(.92)}to{opacity:1;transform:translateY(0) scale(1)}}
  @keyframes dentyarFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  @keyframes dentyarPulse{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:.75;transform:scale(1.12)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  /* ===== DENTYAR readability v4 ===== */
  :root{
    --font-fa:"Vazirmatn","IRANSansX","IRANSans","Dana","Tahoma","Segoe UI",Arial,sans-serif;
    --font-en:"Georgia","Times New Roman",serif;
  }
  html,body{font-family:var(--font-fa);font-size:18px;line-height:1.85;color:#163446;font-weight:500;}
  body{background:#f5f8fa;}
  h1,h2,h3,h4,h5,h6,.clinicName,.sectionTitle,.card h3,.modalBox h3,.btn,.navItem,.tabBar button,.chip,.badge,.statCard .num,.statCard .lbl,
  label,th,.kv b{font-weight:800;}
  h1{font-size:25px!important;} h2{font-size:22px!important;} h3{font-size:19px!important;} h4{font-size:18px!important;}
  .clinicName{font-size:21px!important;font-weight:900!important;color:#123b5d!important;}
  .brandEn{font-family:var(--font-en)!important;font-size:14px!important;font-weight:700!important;letter-spacing:.35px;}
  .brandFa{font-size:14px!important;font-weight:800!important;color:#123b5d;}
  #topHeader .clinicSlogan .brandEn{font-size:13px!important;font-weight:700!important;}
  input,select,textarea{font-family:var(--font-fa)!important;font-size:17px!important;font-weight:600!important;color:#163446!important;background:#fff;}
  input::placeholder,textarea::placeholder{color:#71838c!important;opacity:1!important;font-weight:500!important;}
  button{font-family:var(--font-fa)!important;}
  .btn{font-size:16px!important;font-weight:800!important;min-height:44px;}
  .btn-sm{font-size:14px!important;min-height:38px;padding:7px 12px!important;}
  table{font-size:15.5px!important;}
  th,td{padding:9px 7px!important;}
  th{font-size:15px!important;color:#294b5f!important;background:#edf4f6!important;}
  .card{background:linear-gradient(145deg,#ffffff 0%,#f8fbfc 100%)!important;border:1px solid #d7e5ea!important;box-shadow:0 4px 16px rgba(18,59,93,.07)!important;border-radius:16px!important;}
  .card h3{font-size:18px!important;color:#123b5d!important;}
  .sectionTitle{font-size:15px!important;color:#35596b!important;border-right:4px solid #c89a2b!important;padding-right:9px!important;}
  .kv{font-size:16px!important;line-height:1.9;}
  .empty{font-size:16px!important;color:#536d7a!important;}
  .badge{font-size:13px!important;padding:4px 9px!important;}
  .chip{font-size:14px!important;font-weight:700!important;padding:7px 13px!important;}
  .tabBar button{font-size:15px!important;padding:10px!important;}
  .statCard{border-radius:10px!important;padding:7px 6px!important;}
  .statCard .num{font-size:18px!important;}
  .statCard .lbl{font-size:13px!important;}
  .statCard .iconBadge{width:22px!important;height:22px!important;}
  .statCard .iconBadge svg{width:12px!important;height:12px!important;}
  .navItem{font-size:13px!important;font-weight:800!important;}
  #lockScreen .lockLogo{width:145px!important;height:145px!important;margin-bottom:15px!important;background:#fff;border-radius:50%;padding:5px;box-shadow:0 8px 28px rgba(18,59,93,.16)!important;}
  #lockScreen h2{font-size:29px!important;font-weight:900!important;color:#123b5d!important;}
  #lockScreen .lockSlogan{font-size:15px!important;font-weight:800!important;margin-bottom:22px!important;}
  #lockScreen .lockSlogan .brandEn{font-size:16px!important;color:#0f6f78!important;}
  #lockScreen .lockSlogan .brandFa{font-size:15px!important;margin-top:5px!important;}
  .pinDots{gap:11px!important;}
  .pinDots span{width:12px!important;height:12px!important;}
  .pinPad{grid-template-columns:repeat(3,66px)!important;gap:12px!important;}
  .pinPad button{width:66px!important;height:66px!important;font-size:22px!important;font-weight:900!important;}
  #lockError{font-size:14px!important;}
  #lockHint{font-size:13px!important;}
  #topHeader .clinicLogo{width:58px!important;height:58px!important;object-fit:contain!important;background:#fff;border-radius:50%;padding:2px;border:1px solid #d7e5ea;box-shadow:0 3px 10px rgba(18,59,93,.10);}
  @media(max-width:480px){
    html,body{font-size:17px!important;}
    .card{padding:10px!important;border-radius:12px!important;}
    .card h3{font-size:18px!important;}
    input,select,textarea{font-size:17px!important;min-height:45px;}
    .navItem{font-size:12.5px!important;}
  }

/* ===================== IndexedDB — مرحله اول: آینه‌ی ایمن =====================
   هدف این مرحله: نگه‌داری همزمان همان STATE در localStorage و IndexedDB.
   localStorage فعلاً منبع اصلی باقی می‌ماند؛ هیچ حذف/جایگزینی خودکاری انجام نمی‌شود.
*/
const DENTYAR_IDB = {
  dbName: 'dentyar_db_v1',
  version: 1,
  db: null,
  ready: null
};

function openDentyarIDB(){
  if(DENTYAR_IDB.ready) return DENTYAR_IDB.ready;
  DENTYAR_IDB.ready = new Promise((resolve, reject)=>{
    if(!('indexedDB' in window)){
      reject(new Error('IndexedDB در این محیط در دسترس نیست.'));
      return;
    }
    const req = indexedDB.open(DENTYAR_IDB.dbName, DENTYAR_IDB.version);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if(!db.objectStoreNames.contains('meta')) db.createObjectStore('meta', {keyPath:'key'});
      if(!db.objectStoreNames.contains('patients')){
        const st = db.createObjectStore('patients', {keyPath:'id'});
        st.createIndex('fileNo','fileNo',{unique:false});
        st.createIndex('nationalId','nationalId',{unique:false});
        st.createIndex('createdAt','createdAt',{unique:false});
      }
      if(!db.objectStoreNames.contains('dentists')){
        const st = db.createObjectStore('dentists', {keyPath:'id'});
        st.createIndex('name','name',{unique:false});
      }
      if(!db.objectStoreNames.contains('appointments')){
        const st = db.createObjectStore('appointments', {keyPath:'id'});
        st.createIndex('date','date',{unique:false});
        st.createIndex('dentistId','dentistId',{unique:false});
      }
      if(!db.objectStoreNames.contains('backupSnapshots')){
        const st = db.createObjectStore('backupSnapshots', {keyPath:'id'});
        st.createIndex('ts','ts',{unique:false});
      }
      if(!db.objectStoreNames.contains('patientFiles')){
        const st = db.createObjectStore('patientFiles', {keyPath:'id'});
        st.createIndex('patientId','patientId',{unique:false});
      }
    };
    req.onsuccess = e => {
      DENTYAR_IDB.db = e.target.result;
      DENTYAR_IDB.db.onversionchange = () => DENTYAR_IDB.db.close();
      resolve(DENTYAR_IDB.db);
    };
    req.onerror = () => reject(req.error || new Error('خطا در بازکردن IndexedDB'));
  });
  return DENTYAR_IDB.ready;
}

function idbPutAll(state){
  return openDentyarIDB().then(db=>new Promise((resolve,reject)=>{
    try{
      const tx = db.transaction(['meta','patients','dentists','appointments','backupSnapshots','patientFiles'],'readwrite');
      const meta = tx.objectStore('meta');
      const patients = tx.objectStore('patients');
      const dentists = tx.objectStore('dentists');
      const appointments = tx.objectStore('appointments');
      const backups = tx.objectStore('backupSnapshots');
      const files = tx.objectStore('patientFiles');

      meta.put({key:'schemaVersion', value:1});
      meta.put({key:'lastMirrorAt', value:Date.now()});
      meta.put({key:'clinicState', value:{meta:state.meta, lists:state.lists, treatmentPrices:state.treatmentPrices||{}, backupHistory:state.backupHistory||[]}});
      patients.clear(); dentists.clear(); appointments.clear(); backups.clear(); files.clear();
      (state.patients||[]).forEach(p=>patients.put(p));
      (state.dentists||[]).forEach(d=>dentists.put(d));
      (state.appointments||[]).forEach(a=>appointments.put(a));
      (state.backupHistory||[]).forEach(b=>backups.put(b));
      // در این مرحله فایل‌های Base64 داخل رکورد بیمار بدون تغییر حفظ می‌شوند.
      // جداسازی Blob فایل‌ها برای مرحله بعدی انجام خواهد شد.
      tx.oncomplete = ()=>resolve(true);
      tx.onerror = ()=>reject(tx.error || new Error('خطا در ذخیره آینه IndexedDB'));
      tx.onabort = ()=>reject(tx.error || new Error('تراکنش IndexedDB لغو شد'));
    }catch(e){ reject(e); }
  }));
}

function startDentyarIDBMirror(){
  openDentyarIDB()

}

function loadState(){
  try{
    const raw = localStorage.getItem(APP_KEY);
    if(raw){ STATE = JSON.parse(raw); }
    else { STATE = DEFAULT_STATE(); saveState(); }
    // fill any missing keys from default (forward-compat)
    const def = DEFAULT_STATE();
    for(const k in def){ if(!(k in STATE)) STATE[k] = def[k]; }
    for(const k in def.lists){ if(!(k in STATE.lists)) STATE.lists[k] = def.lists[k]; }
    for(const k in def.meta){ if(!(k in STATE.meta)) STATE.meta[k] = def.meta[k]; }
    // Brand migration: preserve records/settings while updating only the old default clinic identity.
    if(!STATE.meta.clinicName || STATE.meta.clinicName === 'DENTYAR' || /لبخند بهتر/i.test(STATE.meta.clinicName)){
      STATE.meta.clinicName = 'مطب لبخند زیبا';
    }
    if(!STATE.meta.slogan || /سلامت، کرامت، تخصص|دنت‌یار؛ دستیار هوشمند/i.test(STATE.meta.slogan)){
      STATE.meta.slogan = 'Your Smart Dental Assistant';
    }
    ensureStandardLists();
    ensureFormFieldSettings();
    normalizeFinancialData();
    saveState();
  }catch(e){
    console.error('loadState error', e);
    STATE = DEFAULT_STATE();
  }
  ensureStandardLists();
  ensureFormFieldSettings();
  return STATE;
}
function saveState(){
  localStorage.setItem(APP_KEY, JSON.stringify(STATE));
  // آینه‌سازی غیرهمزمان؛ اگر IndexedDB در دسترس نباشد، localStorage همچنان منبع اصلی است.
  if (typeof indexedDB !== 'undefined' && location.protocol !== 'content:') {
    idbPutAll(STATE).catch(err=>console.warn('IndexedDB mirror save failed:', err));
  }
}

function nextFileNo(){

  // «ریست ابتدای هر سال» را فعال کند یا از هر تاریخی «ریست از امروز» انجام دهد.
  const dateStr = todayJalaliCompact();

  if(STATE.meta.fileNoResetDate && dateStr >= STATE.meta.fileNoResetDate && (STATE.meta.fileNoSeq||0)>0){
    // پس از ریست دستی، سریال از همان روز ادامه می‌یابد.
  }
  if(STATE.meta.fileNoMode === 'yearly' && STATE.meta.fileNoYear && STATE.meta.fileNoYear !== yearStr){

  STATE.meta.fileNoYear = yearStr;
  STATE.meta.fileNoDate = dateStr;

  saveState();
  return dateStr + String(STATE.meta.fileNoSeq).padStart(4,'0');
}

/* ===================== امور مالی و پرداخت استاندارد =====================
   مبلغ ناخالص = تعرفه/هزینه قبل از تخفیف
   خالص قابل پرداخت = مبلغ ناخالص - تخفیف - سهم بیمه
   پرداختی = مجموع نقد + کارتخوان + انتقال بانکی + سایر
   باقیمانده = خالص قابل پرداخت - پرداختی
*/
function moneyVal(id){
  const el=document.getElementById(id);
  return el ? (Number(toEnDigits(el.value).replace(/[^\d.-]/g,''))||0) : 0;
}
function calcVisitFinance(prefix){
  const gross=Math.max(0,moneyVal(prefix+'Gross'));
  const discount=Math.min(Math.max(0,moneyVal(prefix+'Discount')), gross);
  const afterDiscount=Math.max(0,gross-discount);
  const insurance=Math.min(Math.max(0,moneyVal(prefix+'Insurance')), afterDiscount);
  const net=Math.max(0,afterDiscount-insurance);
  const cash=Math.max(0,moneyVal(prefix+'Cash'));
  const card=Math.max(0,moneyVal(prefix+'Card'));
  const transfer=Math.max(0,moneyVal(prefix+'Transfer'));
  const other=Math.max(0,moneyVal(prefix+'Other'));
  const refund=Math.max(0,moneyVal(prefix+'Refund'));
  const totalReceived=cash+card+transfer+other;
  const paid=Math.max(0,totalReceived-refund);
  const balance=Math.max(0,net-paid);
  const credit=Math.max(0,paid-net);

/* ---------- تبدیل تاریخ میلادی به شمسی (الگوریتم عمومی و ریاضی، بدون نیاز به کتابخانه) ---------- */
function gregorianToJalali(gy, gm, gd){
  const g_d_m = [0,31,59,90,120,151,181,212,243,273,304,334];
  let jy = (gy <= 1600) ? 0 : 979;
  gy -= (gy <= 1600) ? 621 : 1600;
  const gy2 = (gm > 2) ? (gy + 1) : gy;
  let days = (365*gy) + Math.floor((gy2+3)/4) - Math.floor((gy2+99)/100) + Math.floor((gy2+399)/400) - 80 + gd + g_d_m[gm-1];
  jy += 33 * Math.floor(days/12053);
  days %= 12053;
  jy += 4 * Math.floor(days/1461);
  days %= 1461;
  if(days > 365){
    jy += Math.floor((days-1)/365);
    days = (days-1) % 365;
  }
  let jm, jd;
  if(days < 186){
    jm = 1 + Math.floor(days/31);
    jd = 1 + (days % 31);
  } else {
    jm = 7 + Math.floor((days-186)/30);
    jd = 1 + ((days-186) % 30);
  }
  return [jy, jm, jd];
}
function todayJalaliCompact(){
  const d = new Date();
  const [jy, jm, jd] = gregorianToJalali(d.getFullYear(), d.getMonth()+1, d.getDate());

}

const FA_DIGITS = '۰۱۲۳۴۵۶۷۸۹';

function toFaTextNodeTree(root=document.body){
  const walker=document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(node){
      const p=node.parentElement;
      if(!p || ['SCRIPT','STYLE','TEXTAREA'].includes(p.tagName)) return NodeFilter.FILTER_REJECT;
      if(p.closest('[data-no-fa-digits]')) return NodeFilter.FILTER_REJECT;
      return /[0-9]/.test(node.nodeValue||'') ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
    }

  const nodes=[]; let n; while(n=walker.nextNode()) nodes.push(n);
  nodes.forEach(x=>{ x.nodeValue=faDigits(x.nodeValue); });
}

function currentJalaliDateFa(){

function jalaliToGregorian(jy,jm,jd){
  jy=Number(jy); jm=Number(jm); jd=Number(jd);
  if(jy<1200 || jy>1600 || jm<1 || jm>12 || jd<1 || jd>31) return null;
  jy += 1595;
  let days = -355668 + 365*jy + Math.floor(jy/33)*8 + Math.floor(((jy%33)+3)/4) + jd + (jm<7 ? (jm-1)*31 : ((jm-7)*30)+186);
  let gy=400*Math.floor(days/146097); days%=146097;
  if(days>36524){ gy+=100*Math.floor(--days/36524); days%=36524; if(days>=365) days++; }
  gy+=4*Math.floor(days/1461); days%=1461;
  if(days>365){ gy+=Math.floor((days-1)/365); days=(days-1)%365; }
  const gd=days+1;
  const leap=(gy%4===0 && gy%100!==0) || gy%400===0;
  const gmDays=[31,leap?29:28,31,30,31,30,31,31,30,31,30,31];
  let gm=1, rem=gd;
  while(gm<=12 && rem>gmDays[gm-1]){ rem-=gmDays[gm-1]; gm++; }
  return [gy,gm,rem];
}
function v26ISOFromJalali(text){
  const m=toEnDigits(String(text||'').trim()).match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})$/);
  if(!m) return null;
  const g=jalaliToGregorian(+m[1],+m[2],+m[3]);
  if(!g) return null;
  return g[0]+'-'+String(g[1]).padStart(2,'0')+'-'+String(g[2]).padStart(2,'0');
}
function v26JalaliProxy(input){

/* ===================== XLSX writer (pure JS, zip "store" method — no compression, no deps) ===================== */
const XLSXWriter = (function(){
  function crc32(buf){

      const t=[];
      for(let n=0;n<256;n++){ c=n; for(let k=0;k<8;k++){ c = (c&1)?(0xEDB88320 ^ (c>>>1)):(c>>>1); } t[n]=c; }

    })());

    for(let i=0;i<buf.length;i++){ crc = (crc>>>8) ^ crcTable[(crc ^ buf[i]) & 0xFF]; }
    return (crc ^ (-1)) >>> 0;
  }
  function strToBytes(str){ return new TextEncoder().encode(str); }
  function dosDateTime(){
    const d = new Date();
    const time = ((d.getHours()&0x1F)<<11) | ((d.getMinutes()&0x3F)<<5) | ((d.getSeconds()/2)&0x1F);
    const date = (((d.getFullYear()-1980)&0x7F)<<9) | (((d.getMonth()+1)&0xF)<<5) | (d.getDate()&0x1F);
    return {time, date};
  }
  function makeZip(files){ // files: [{name, data(Uint8Array)}]
    const {time, date} = dosDateTime();
    let localParts=[], centralParts=[], offset=0;
    for(const f of files){
      const nameBytes = strToBytes(f.name);
      const data = f.data;
      const crc = crc32(data);
      const size = data.length;
      const local = new Uint8Array(30 + nameBytes.length + size);
      const dv = new DataView(local.buffer);
      dv.setUint32(0, 0x04034b50, true);
      dv.setUint16(4, 20, true); // version needed
      dv.setUint16(6, 0, true); // flags
      dv.setUint16(8, 0, true); // method = 0 store
      dv.setUint16(10, time, true);
      dv.setUint16(12, date, true);
      dv.setUint32(14, crc, true);
      dv.setUint32(18, size, true);
      dv.setUint32(22, size, true);
      dv.setUint16(26, nameBytes.length, true);
      dv.setUint16(28, 0, true);
      local.set(nameBytes, 30);
      local.set(data, 30+nameBytes.length);
      localParts.push(local);

      const central = new Uint8Array(46 + nameBytes.length);
      const cdv = new DataView(central.buffer);
      cdv.setUint32(0, 0x02014b50, true);
      cdv.setUint16(4, 20, true);
      cdv.setUint16(6, 20, true);
      cdv.setUint16(8, 0, true);
      cdv.setUint16(10, 0, true);
      cdv.setUint16(12, time, true);
      cdv.setUint16(14, date, true);
      cdv.setUint32(16, crc, true);
      cdv.setUint32(20, size, true);
      cdv.setUint32(24, size, true);
      cdv.setUint16(28, nameBytes.length, true);
      cdv.setUint16(30, 0, true);
      cdv.setUint16(32, 0, true);
      cdv.setUint16(34, 0, true);
      cdv.setUint16(36, 0, true);
      cdv.setUint32(38, 0, true);
      cdv.setUint32(42, offset, true);
      central.set(nameBytes, 46);
      centralParts.push(central);

      offset += local.length;
    }

    let centralSize=0; for(const c of centralParts) centralSize += c.length;

    const end = new Uint8Array(22);
    const edv = new DataView(end.buffer);

    edv.setUint16(4,0,true); edv.setUint16(6,0,true);
    edv.setUint16(8, files.length, true);
    edv.setUint16(10, files.length, true);
    edv.setUint32(12, centralSize, true);
    edv.setUint32(16, centralStart, true);
    edv.setUint16(20, 0, true);

    const totalLen = offset + centralSize + end.length;
    const out = new Uint8Array(totalLen);
    let p=0;
    for(const l of localParts){ out.set(l,p); p+=l.length; }

    out.set(end,p);
    return out;
  }
  function esc(s){
    return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function colName(n){
    let s=''; n++;
    while(n>0){ let m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=Math.floor((n-1)/26); }
    return s;
  }

  function buildSheetXml(rows){

        if(typeof cell === 'number' && isFinite(cell)){
          cellsXml += `<c r="${ref}"><v>${cell}</v></c>`;
        } else {

        }

    });
    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetPr/><sheetViews><sheetView rightToLeft="1" workbookViewId="0"/></sheetViews><sheetData>${rowsXml}</sheetData></worksheet>`;
  }
  function build(sheetName, rows){
    const contentTypes = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`;
    const rootRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`;
    const workbook = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="${esc(sheetName)}" sheetId="1" r:id="rId1"/></sheets></workbook>`;
    const workbookRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`;
    const styles = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="1"><font><sz val="11"/><name val="Tahoma"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;
    const sheet1 = buildSheetXml(rows);
    const files = [
      {name:'[Content_Types].xml', data: strToBytes(contentTypes)},
      {name:'_rels/.rels', data: strToBytes(rootRels)},
      {name:'xl/workbook.xml', data: strToBytes(workbook)},
      {name:'xl/_rels/workbook.xml.rels', data: strToBytes(workbookRels)},
      {name:'xl/styles.xml', data: strToBytes(styles)},
      {name:'xl/worksheets/sheet1.xml', data: strToBytes(sheet1)},

  }

})();


async function v27NativeFile(bytes, filename, mime, shouldShare=true){
  try{
    const C=window.Capacitor;
    if(!C || !C.isNativePlatform || !C.isNativePlatform()) return {saved:false,shared:false};
    const fs=C.registerPlugin ? C.registerPlugin('Filesystem') : null;
    const sh=C.registerPlugin ? C.registerPlugin('Share') : null;
    if(!fs || !fs.writeFile) return {saved:false,shared:false};
    const arr=bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);
    let binary='';
    const chunk=0x8000;
    for(let p=0;p<arr.length;p+=chunk) binary+=String.fromCharCode.apply(null,arr.subarray(p,p+chunk));
    const data=btoa(binary);
    const safeName=String(filename).replace(/[\\/:*?"<>|]/g,'_');
    const path='DENTYAR/'+safeName;
    await fs.writeFile({path,data,directory:'DOCUMENTS',recursive:true});
    let shared=false;
    if(shouldShare && sh && sh.share){
      try{
        let uri='';
        if(fs.getUri){
          const r=await fs.getUri({path,directory:'DOCUMENTS'});
          uri=r && (r.uri||r.path||'');
        }
        if(uri){
          await sh.share({title:'DENTYAR',text:'فایل دنت‌یار: '+safeName,url:uri,dialogTitle:'ارسال فایل'});
          shared=true;
        }
      }catch(e){ console.warn('V27 native share failed',e); }
    }
    return {saved:true,shared};
  }catch(e){ console.warn('V27 native file save failed',e); return {saved:false,shared:false,error:e}; }
}
async function downloadBlob(bytes, filename, mime, options={}){

      await navigator.share({title:'DENTYAR',text:'فایل دنت‌یار: '+filename,files:[file]});

  const a=document.createElement('a'); a.href=url; a.download=filename; a.rel='noopener';
  document.body.appendChild(a); a.click();
  setTimeout(()=>{a.remove();URL.revokeObjectURL(url);},1200);
  return 'downloaded';
}
async function exportRowsAsXLSX(rows, filename, sheetName, options={}){
  const bytes = XLSXWriter.build(sheetName||'گزارش', rows);
  return await downloadBlob(bytes, filename, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', options);
}
async function exportRowsAsCSV(rows, filename, options={}){
  const csv = rows.map(r=>r.map(c=>{
    let s = String(c==null?'':c);
    if(/[",\n]/.test(s)) s = '"'+s.replace(/"/g,'""')+'"';
    return s;
  }).join(',')).join('\r\n');
  const bytes = new TextEncoder().encode('\uFEFF'+csv);
  return await downloadBlob(bytes, filename, 'text/csv;charset=utf-8', options);
}

function renderDashboard(){
  const patients=STATE.patients||[];
  const today=todayISO(), jy=currentJalaliYear();
  const visits=patients.flatMap(p=>(p.visits||[]).map(v=>({p,v})));
  const todayVisits=visits.filter(x=>x.v.date===today).length;
  const todayAppointments=(STATE.appointments||[]).filter(a=>a.date===today).length;
  const yearPatients=patients.filter(p=>p.createdAt && gregorianToJalali(new Date(p.createdAt).getFullYear(),new Date(p.createdAt).getMonth()+1,new Date(p.createdAt).getDate())[0]===jy).length;
  const totalPatients=patients.length;
  const completed=visits.filter(x=>x.v.outcome==='تکمیل‌شده').length;
  const ongoing=visits.filter(x=>x.v.outcome==='در حال درمان').length;
  const referrals=visits.filter(x=>x.v.outcome==='ارجاع‌شده').length;
  const cancelled=visits.filter(x=>x.v.outcome==='لغوشده').length;
  const totals=visits.reduce((a,x)=>{const f=financeOf(x.v);a.gross+=f.gross;a.discount+=f.discount;a.insurance+=f.insurance;a.net+=f.net;a.cash+=f.cash;a.nonCash+=f.card+f.transfer+f.other;a.refund+=f.refund;a.paid+=f.paid;a.balance+=f.balance;return a},{gross:0,discount:0,insurance:0,net:0,cash:0,nonCash:0,refund:0,paid:0,balance:0});
  const typeCounts={}; visits.forEach(x=>{const t=(x.v.treatmentType||'سایر').trim()||'سایر';typeCounts[t]=(typeCounts[t]||0)+1});
  const typeRows=Object.entries(typeCounts).sort((a,b)=>b[1]-a[1]);
  const topTreatment=typeRows[0]?.[0]||'—';
  // Only concise, verified clinical metrics belong on the home dashboard.
  const metricDefs={
    totalPatients:['کل بیماران',totalPatients,'patients',ICON_PEOPLE,'c-teal'],
    newPatients:[`بیماران جدید سال ${jy}`,yearPatients,'patients',ICON_PEOPLE,'c-teal'],
    todayVisits:['مراجعات امروز',todayVisits,'reports',ICON_CLIPBOARD,'c-green'],
    todayAppointments:['نوبت‌های امروز',todayAppointments,'appointments',NAV_ICONS.appointments,'c-gold'],
    treatments:['درمان‌های تکمیل‌شده',completed,'reports',ICON_CHECK,'c-green'],
    ongoing:['درمان‌های در حال انجام',ongoing,'reports',ICON_CLIPBOARD,'c-purple'],
    referrals:['ارجاع‌شده',referrals,'reports',ICON_PEOPLE,'c-navy'],
    cancelled:['لغوشده',cancelled,'reports',ICON_X,'c-red'],
    treatmentCount:['تعداد کل درمان‌ها',visits.length,'reports',ICON_CLIPBOARD,'c-teal'],
    dentists:['دندان‌پزشکان',STATE.dentists.length,'dentists',ICON_PEOPLE,'c-navy']
  };
  const curated=['totalPatients','newPatients','todayVisits','todayAppointments','treatments','ongoing','treatmentCount','dentists'];
  let saved=(STATE.meta.dashboardMetrics||[]).filter(k=>metricDefs[k]);
  // Prevent legacy/broken metric sets from resurrecting stale dashboard labels.
  if(saved.length<4 || saved.some(k=>['completed','levels','surfaces'].includes(k))){ saved=curated; }
  const keys=saved.slice(0,10);
  const statHtml=keys.map(k=>{const d=metricDefs[k];const nav=d[2]==='reports'?"navigate('reports')":`navigate('${d[2]}')`;return `<button type="button" class="statCard ${d[4]} clickable" onclick="${nav}" aria-label="${esc(d[0])}"><span class="iconBadge">${d[3]}</span><span class="num">${esc(faDigits(d[1]))}</span><span class="lbl">${esc(d[0])}</span></button>`}).join('');
  const financeItems=[
    ['مبلغ ناخالص خدمات',totals.gross,'gross'],['تخفیف',totals.discount,'discount'],['سهم بیمه',totals.insurance,'insurance'],
    ['خالص قابل پرداخت',totals.net,'net'],['دریافت نقدی',totals.cash,'cash'],['دریافت غیرنقدی',totals.nonCash,'nonCash'],
    ['استرداد وجه',totals.refund,'refund'],['کل دریافتی',totals.paid,'paid'],['مطالبات / باقیمانده',totals.balance,'balance']
  ];
  const financeHtml=financeItems.map(([label,val,key])=>`<div class="financeItem finance-${key}"><span>${esc(label)}</span><b>${esc(fmtMoney(val))}</b></div>`).join('');
  const servicesHtml=typeRows.length
    ? typeRows.slice(0,8).map(([name,count])=>`<div class="serviceRow"><span>${esc(name)}</span><b>${esc(faDigits(count))}</b></div>`).join('')
    : '<div class="empty">هنوز خدمتی ثبت نشده است</div>';
  document.getElementById('pageContent').innerHTML=`
    <section class="dashboardHero">
      <div><div class="dashboardKicker">DENTYAR · داشبورد مطب</div><h1>${esc(STATE.meta.clinicName||'مطب لبخند زیبا')}</h1><p>نمای کلی عملکرد و وضعیت درمانی مطب در سال ${esc(faDigits(jy))}</p></div>
      <div class="heroTooth">${ICON_TOOTH}</div>
    </section>
    <div class="sectionTitle">شاخص‌های کلیدی</div>
    <section class="statGrid dashboardStats">${statHtml}</section>
    <div class="sectionTitle">خلاصه مالی</div>
    <section class="card financeCard"><div class="financeGrid">${financeHtml}</div></section>
    <div class="sectionTitle">خدمات پرتکرار</div>
    <section class="card servicesCard"><div class="servicesList">${servicesHtml}</div></section>
  `;
}

function buildSmsMessage(template, appt){
  let msg = (template||'')
    .replace(/\{نام\}/g, appt.name||'')
    .replace(/\{تاریخ\}/g, fmtDateFa(appt.date))
    .replace(/\{ساعت\}/g, appt.time||'');
  const footer = [STATE.meta.clinicName, STATE.meta.supportPhone].filter(Boolean).join(' - ');
  return footer? (msg + '\n' + footer) : msg;
}
function openSmsComposer(phone, message){
  const p = toEnDigits(phone||'').replace(/\s+/g,'');
  const url = 'sms:' + encodeURIComponent(p) + '?body=' + encodeURIComponent(message);
  window.location.href = url;
}

function isWithinNextHour(appt){
  if(!appt.date || !appt.time) return false;
  const dt = new Date(appt.date+'T'+appt.time+':00');
  const diffMin = (dt - new Date())/60000;
  return diffMin >= -10 && diffMin <= 60; // تا ۱۰ دقیقه بعد از زمان نوبت هم نمایش داده شود
}

function checkDuplicateNationalId(nid, excludeId){
  if(!nid) return null;
  const n = toEnDigits(nid).trim();
  if(!n) return null;
  return STATE.patients.find(p=> p.id!==excludeId && toEnDigits(p.nationalId||'').trim()===n) || null;
}
// اعتبارسنجی کد ملی ایرانی بر اساس الگوریتم رسمی چک‌سام (۱۰ رقمی)
function isValidIranianNationalId(nid){
  const n = toEnDigits(nid||'').trim();
  if(!/^\d{10}$/.test(n)) return false;
  if(/^(\d)\1{9}$/.test(n)) return false; // ده رقم یکسان معتبر نیست
  const digits = n.split('').map(Number);
  const check = digits[9];
  let sum = 0;
  for(let i=0;i<9;i++){ sum += digits[i] * (10-i); }
  const remainder = sum % 11;
  return (remainder < 2) ? (check === remainder) : (check === (11-remainder));
}

  const p = editing || {name:'', nationalId:'', phone:'', gender:'', birthYear:'', address:'', notes:'', insuranceType:'', visitType:'نوبت اول', baseInsurance:'', supplementalInsurance:'ندارد', insuranceNumber:'', policyNumber:'', coverageCeiling:0, franchisePercent:0, ...(prefill||{})};
  showModal(`
    <h3>${editing? 'ویرایش بیمار' : 'ثبت بیمار جدید'}</h3>
    <label>نام و نام‌خانوادگی * (تنها فیلد الزامی)</label>
    <input type="text" id="pfName" value="${esc(p.name)}">
    <div class="grid2">
      <div><label>کد ملی</label><input type="text" id="pfNid" value="${esc(p.nationalId||'')}"></div>
      <div><label>شماره تماس</label><input type="tel" id="pfPhone" value="${esc(p.phone||'')}"></div>
    </div>
    <div class="grid2">
      <div><label>جنسیت</label>
        <select id="pfGender">
          <option value="">— انتخاب —</option>
          <option ${p.gender==='مرد'?'selected':''}>مرد</option>

        </select>
      </div>
      <div><label>سال تولد</label><input type="text" id="pfBirth" value="${esc(p.birthYear||'')}"></div>
    </div>
    <div class="grid2">
      <div><label>بیمه پایه</label><select id="pfBaseInsurance"><option value="">— انتخاب —</option>${(STATE.lists.baseInsuranceTypes||[]).map(t=>`<option ${p.baseInsurance===t||(!p.baseInsurance&&p.insuranceType===t)?'selected':''}>${esc(t)}</option>`).join('')}</select></div>
      <div><label>بیمه تکمیلی</label><select id="pfSupplementalInsurance"><option value="ندارد">ندارد</option>${(STATE.lists.supplementalInsuranceTypes||[]).map(t=>`<option ${p.supplementalInsurance===t?'selected':''}>${esc(t)}</option>`).join('')}</select></div>
    </div>
    <div class="grid2">
      <div><label>شماره بیمه / بیمه‌شده</label><input type="text" id="pfInsuranceNo" value="${esc(p.insuranceNumber||'')}"></div>
      <div><label>شماره بیمه‌نامه / قرارداد</label><input type="text" id="pfPolicyNo" value="${esc(p.policyNumber||'')}"></div>
    </div>
    <div class="grid2">
      <div><label>سقف تعهد بیمه (تومان)</label><input type="text" id="pfCoverageCeiling" value="${p.coverageCeiling||''}"></div>
      <div><label>فرانشیز (%)</label><input type="number" id="pfFranchise" min="0" max="100" value="${p.franchisePercent??''}"></div>
    </div>
    <label>نوبت اول / پیگیری</label>
    <select id="pfVisitType">
      <option ${p.visitType==='نوبت اول'?'selected':''}>نوبت اول</option>
      <option ${p.visitType==='پیگیری'?'selected':''}>پیگیری</option>
    </select>
    <label>هزینه مراجعه / درمان (تومان)</label>
    <input type="text" id="pfCost" inputmode="numeric" placeholder="0" value="${editing && p.visits && p.visits.length ? (Number(p.visits[0].cost)||'') : ''}">
    <label>آدرس</label>
    <input type="text" id="pfAddress" value="${esc(p.address||'')}">
    <label>توضیحات</label>
    <textarea id="pfNotes">${esc(p.notes||'')}</textarea>
    <div id="pfDupWarning" style="color:var(--danger);font-size:12.5px;margin-top:6px;"></div>
    <div class="modalBtns">
      <button class="btn btn-outline" onclick="closeModal()">انصراف</button>
      <button class="btn btn-primary" onclick="savePatientForm(${editing? `'${editing.id}'`:'null'})">ذخیره</button>
    </div>
  `);
  document.getElementById('pfNid').addEventListener('input', function(){
    const v = this.value.trim();
    const dup = checkDuplicateNationalId(v, editing?editing.id:null);
    if(dup){ document.getElementById('pfDupWarning').textContent = `⚠ این کد ملی قبلاً برای «${dup.name}» (پرونده #${dup.fileNo}) ثبت شده است.`; }
    else if(v && !isValidIranianNationalId(v)){ document.getElementById('pfDupWarning').textContent = '⚠ کد ملی معتبر به نظر نمی‌رسد.'; }
    else { document.getElementById('pfDupWarning').textContent = ''; }
  });
}

function savePatientForm(editingId){
  const name = document.getElementById('pfName').value.trim();
  if(!name){ modalAlert('خطا','نام بیمار الزامی است.'); return; }
  const data = {
    name,
    nationalId: document.getElementById('pfNid').value.trim(),
    phone: document.getElementById('pfPhone').value.trim(),
    gender: document.getElementById('pfGender').value,
    birthYear: document.getElementById('pfBirth').value.trim(),
    insuranceType: document.getElementById('pfBaseInsurance').value,
    baseInsurance: document.getElementById('pfBaseInsurance').value,
    supplementalInsurance: document.getElementById('pfSupplementalInsurance').value,
    insuranceNumber: document.getElementById('pfInsuranceNo').value.trim(),
    policyNumber: document.getElementById('pfPolicyNo').value.trim(),
    coverageCeiling: moneyVal('pfCoverageCeiling'),
    franchisePercent: Number(document.getElementById('pfFranchise').value)||0,
    visitType: document.getElementById('pfVisitType').value,
    address: document.getElementById('pfAddress').value.trim(),
    notes: document.getElementById('pfNotes').value.trim(),
  };
  const cost = Number(toEnDigits(document.getElementById('pfCost').value)) || 0;
  if(editingId){
    const p = STATE.patients.find(x=>x.id===editingId);
    Object.assign(p, data);
    p.visits = p.visits || [];
    if(p.visits.length){
      p.visits[0].cost = cost;
    } else if(cost > 0){
      p.visits.push({id:uid('v'), date:todayISO(), treatmentType:STATE.lists.treatmentTypes[0]||'مشاوره', dentistId:'', outcome:STATE.lists.outcomes[0]||'تکمیل‌شده', cost, note:'', createdAt:Date.now()});
    }
  } else {
    const visits = cost > 0 ? [{id:uid('v'), date:todayISO(), treatmentType:STATE.lists.treatmentTypes[0]||'مشاوره', dentistId:'', outcome:STATE.lists.outcomes[0]||'تکمیل‌شده', cost, note:'', createdAt:Date.now()}] : [];
    STATE.patients.push({
      id: uid('pt'), fileNo: nextFileNo(), createdAt: Date.now(),
      visits, files: [], ...data
    });
  }
  saveState();
  closeModal();
  toast('اطلاعات بیمار ذخیره شد');
  renderPatients();
}

function deletePatient(id){
  modalConfirm('حذف بیمار','آیا از حذف کامل این بیمار و تاریخچه‌ی او مطمئن هستید؟ این عمل قابل بازگشت نیست.', ()=>{
    STATE.patients = STATE.patients.filter(p=>p.id!==id);
    saveState(); openPatientId=null; renderPatients(); toast('بیمار حذف شد');
  });
}

function addVisit(patientId){
  const p = STATE.patients.find(x=>x.id===patientId);
  if(!p) return;
  p.visits = p.visits || [];
  p.visits.push({
    id: uid('vs'),
    date: document.getElementById('vDate').value || todayISO(),
    cost: moneyVal('vGross'),
    grossAmount: moneyVal('vGross'),
    discount: moneyVal('vDiscount'),
    insuranceShare: moneyVal('vInsurance'),
    netAmount: calcVisitFinance('v').net,
    cashPaid: moneyVal('vCash'),
    cardPaid: moneyVal('vCard'),
    transferPaid: moneyVal('vTransfer'),
    otherPaid: moneyVal('vOther'),
    refund: moneyVal('vRefund'),
    paidAmount: calcVisitFinance('v').paid,
    balance: calcVisitFinance('v').balance,
    paymentType: document.getElementById('vPaymentType').value,
    dentistId: document.getElementById('vDentist').value,
    treatmentType: document.getElementById('vType').value,
    treatmentServices: selectedServiceValues('v'),
    serviceItems: selectedServiceValues('v').map(name=>({name, price:getTreatmentPrice(name)})),
    outcome: document.getElementById('vOutcome').value,
    note: document.getElementById('vNote').value.trim(),
  });
  saveState();
  toast('مرحله‌ی درمانی ثبت شد');
  renderPatientFile(patientId);
}
function deleteVisit(patientId, visitId){
  modalConfirm('حذف مرحله‌ی درمانی','آیا از حذف این رکورد مطمئن هستید؟', ()=>{
    const p = STATE.patients.find(x=>x.id===patientId);
    p.visits = (p.visits||[]).filter(v=>v.id!==visitId);
    saveState(); renderPatientFile(patientId); toast('حذف شد');
  });
}
function handleFileAttach(patientId, fileList){
  const p = STATE.patients.find(x=>x.id===patientId);
  if(!p) return;
  p.files = p.files || [];
  const readers = Array.from(fileList).map(file=> new Promise(res=>{
    const reader = new FileReader();
    reader.onload = ()=> res({name:file.name, type:file.type, data:reader.result});
    reader.readAsDataURL(file);
  }));
  Promise.all(readers).then(results=>{
    p.files.push(...results);
    saveState();
    renderPatientFile(patientId);
    toast('فایل(ها) پیوست شد');
  });
}
function removePatientFile(patientId, idx){
  const p = STATE.patients.find(x=>x.id===patientId);
  modalConfirm('حذف فایل','آیا از حذف این فایل مطمئن هستید؟', ()=>{
    p.files.splice(idx,1);
    saveState(); renderPatientFile(patientId);
  });
}

function saveSingleDentist(){
  const name = document.getElementById('dName').value.trim();
  if(!name){ modalAlert('خطا','نام الزامی است.'); return; }
  STATE.dentists.push({id:uid('dr'), name, specialty:document.getElementById('dSpecialty').value, active:true});
  saveState(); toast('دندان‌پزشک افزوده شد'); renderDentists();
}
function saveBulkDentists(){
  const lines = document.getElementById('bulkDentists').value.split('\n').map(l=>l.trim()).filter(Boolean);
  if(!lines.length){ modalAlert('خطا','حداقل یک نام وارد کنید.'); return; }
  lines.forEach(line=>{
    const [name, specialty] = line.split('،').map(s=>s&&s.trim());
    STATE.dentists.push({id:uid('dr'), name: name||line, specialty: specialty||'', active:true});
  });
  saveState(); toast(`${lines.length} دندان‌پزشک افزوده شد`); pageParams={}; renderDentists();
}
function editDentist(id){
  const d = STATE.dentists.find(x=>x.id===id);
  showModal(`
    <h3>ویرایش دندان‌پزشک</h3>
    <label>نام</label><input type="text" id="edName" value="${esc(d.name)}">
    <label>تخصص</label>
    <select id="edSpecialty">${STATE.lists.specialties.map(s=>`<option ${d.specialty===s?'selected':''}>${esc(s)}</option>`).join('')}</select>
    <div class="modalBtns">
      <button class="btn btn-outline" onclick="closeModal()">انصراف</button>
      <button class="btn btn-primary" onclick="saveEditDentist('${id}')">ذخیره</button>
    </div>
  `);
}
function saveEditDentist(id){
  const d = STATE.dentists.find(x=>x.id===id);
  d.name = document.getElementById('edName').value.trim();
  d.specialty = document.getElementById('edSpecialty').value;
  saveState(); closeModal(); toast('ذخیره شد'); renderDentists();
}
function deleteDentist(id){
  modalConfirm('حذف دندان‌پزشک','آیا مطمئن هستید؟ سوابق درمانی مرتبط حذف نخواهد شد.', ()=>{
    STATE.dentists = STATE.dentists.filter(d=>d.id!==id);
    saveState(); renderDentists(); toast('حذف شد');
  });
}

let reportFilters = {};
function renderReports(){
  if(pageParams && Object.keys(pageParams).length){
    reportFilters = {...pageParams};
    pageParams = {};
  }
  const f = reportFilters;
  // Build flat rows: one row per visit (joined with patient info)
  let rows = [];
  STATE.patients.forEach(p=>{
    if((p.visits||[]).length===0){
      rows.push({patient:p, visit:null});
    } else {
      p.visits.forEach(v=> rows.push({patient:p, visit:v}));
    }
  });

  rows = rows.filter(r=>{
    const p = r.patient, v = r.visit;
    if(f.gender && p.gender!==f.gender) return false;
    if(f.treatmentType && (!v || v.treatmentType!==f.treatmentType)) return false;
    if(f.outcome && (!v || v.outcome!==f.outcome)) return false;
    if(f.dentistId && (!v || v.dentistId!==f.dentistId)) return false;
    if(f.dateFrom && (!v || v.date < f.dateFrom)) return false;
    if(f.dateTo && (!v || v.date > f.dateTo)) return false;
    if(f.q){
      const q = toEnDigits(f.q).toLowerCase();
      const hay = toEnDigits(`${p.name} ${p.nationalId||''} ${p.phone||''} ${p.fileNo} ${v? v.treatmentType:''}`).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });

  const financialTotals = rows.reduce((a,r)=>{ if(r.visit){const f=financeOf(r.visit); a.gross+=f.gross; a.discount+=f.discount; a.insurance+=f.insurance; a.net+=f.net; a.paid+=f.paid; a.balance+=f.balance;} return a; },{gross:0,discount:0,insurance:0,net:0,paid:0,balance:0});

      </div>

        <div><label>از تاریخ</label><input type="date" id="repFrom" value="${esc(f.dateFrom||'')}"></div>
        <div><label>تا تاریخ</label><input type="date" id="repTo" value="${esc(f.dateTo||'')}"></div>
      </div>
      <div class="grid2">
        <div><label>جنسیت</label>
          <select id="repGender"><option value="">همه</option>
            <option ${f.gender==='مرد'?'selected':''}>مرد</option>
            <option ${f.gender==='زن'?'selected':''}>زن</option>
          </select>
        </div>
        <div><label>دندان‌پزشک</label>
          <select id="repDentist"><option value="">همه</option>
            ${STATE.dentists.map(d=>`<option value="${d.id}" ${f.dentistId===d.id?'selected':''}>${esc(d.name)}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="grid2">
        <div><label>نوع درمان</label>
          <select id="repType"><option value="">همه</option>
            ${STATE.lists.treatmentTypes.map(t=>`<option ${f.treatmentType===t?'selected':''}>${esc(t)}</option>`).join('')}
          </select>
        </div>
        <div><label>نتیجه</label>
          <select id="repOutcome"><option value="">همه</option>
            ${STATE.lists.outcomes.map(t=>`<option ${f.outcome===t?'selected':''}>${esc(t)}</option>`).join('')}
          </select>

function getReportRowsForExport(){

function snapshotData(){
  return {
    version:1, exportedAt: Date.now(), clinicName: STATE.meta.clinicName,
    data: { patients:STATE.patients, dentists:STATE.dentists, appointments:STATE.appointments, lists:STATE.lists, meta:STATE.meta }
  };

async function createBackup(){
  const snap = snapshotData();
  const json = JSON.stringify(snap);
  // save to in-app history (store in localStorage separately to avoid infinite growth of main state)
  const id = uid('bk');
  try{ localStorage.setItem(BACKUP_STORE_PREFIX+id, json); }catch(e){ console.warn('local snapshot save failed', e); }
  STATE.backupHistory = STATE.backupHistory || [];
  STATE.backupHistory.push({id, ts:Date.now(), note:`${STATE.patients.length} بیمار`, snapshotSize:json.length});
  // keep only last 20 in-browser snapshots to avoid bloating storage
  if(STATE.backupHistory.length>20){
    const removed = STATE.backupHistory.splice(0, STATE.backupHistory.length-20);
    removed.forEach(r=>{ try{ localStorage.removeItem(BACKUP_STORE_PREFIX+r.id); }catch(e){} });
  }
  saveState();
  const result=await downloadBlob(new TextEncoder().encode(json), `پشتیبان-DENTYAR-${todayJalaliCompact()}.json`, 'application/json', {share:false});
  toast(result==='saved'?'پشتیبان در Documents/DENTYAR ذخیره شد':result==='downloaded'?'فایل پشتیبان برای دانلود آماده شد':'پشتیبان آماده شد');
  renderBackup();
}

function restoreFromHistory(id, mode){
  const raw = localStorage.getItem(BACKUP_STORE_PREFIX+id);
  if(!raw){ modalAlert('خطا','این نسخه‌ی پشتیبان در این مرورگر یافت نشد (شاید حافظه پاک شده). از فایل دانلودشده استفاده کنید.'); return; }
  const snap = JSON.parse(raw);
  performRestore(snap, mode);
}

function handleRestoreFile(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    let snap;
    try{ snap = JSON.parse(reader.result); }
    catch(e){ modalAlert('خطا','فایل انتخاب‌شده معتبر نیست.'); return; }
    modalConfirm('نحوه‌ی بازیابی','می‌خواهید اطلاعات این فایل با اطلاعات فعلی «ادغام» شود یا اطلاعات فعلی به‌طور کامل «جایگزین» شود؟',
      ()=>performRestore(snap,'merge'), 'ادغام', 'btn-outline');
    setTimeout(()=>{
      const box = document.querySelector('.modalBtns');
      if(box){
        const replaceBtn = document.createElement('button');
        replaceBtn.className='btn btn-danger'; replaceBtn.textContent='جایگزینی کامل';
        replaceBtn.onclick = ()=>{ closeModal(); performRestore(snap,'replace'); };
        box.appendChild(replaceBtn);
      }
    }, 50);
  };
  reader.readAsText(file);
}

function performRestore(snap, mode){
  if(!snap || !snap.data){ modalAlert('خطا','ساختار فایل پشتیبان نامعتبر است.'); return; }
  const incoming = snap.data;
  if(mode==='replace'){
    STATE.patients = incoming.patients || [];
    STATE.dentists = incoming.dentists || [];
    STATE.appointments = incoming.appointments || [];
    STATE.lists = incoming.lists || STATE.lists;
    STATE.meta = {...STATE.meta, ...(incoming.meta||{})};
  } else { // merge
    const byId = (arr)=> new Map(arr.map(x=>[x.id,x]));
    const mergeArr = (current, incoming)=>{
      const map = byId(current);
      (incoming||[]).forEach(item=>{ map.set(item.id, item); }); // incoming overwrites same-id, adds new
      return Array.from(map.values());
    };
    STATE.patients = mergeArr(STATE.patients, incoming.patients);
    STATE.dentists = mergeArr(STATE.dentists, incoming.dentists);
    STATE.appointments = mergeArr(STATE.appointments, incoming.appointments);
    if(incoming.lists){
      Object.keys(incoming.lists).forEach(k=>{
        const set = new Set([...(STATE.lists[k]||[]), ...(incoming.lists[k]||[])]);
        STATE.lists[k] = Array.from(set);
      });
    }
  }
  saveState();
  toast(mode==='replace'? 'اطلاعات جایگزین شد' : 'اطلاعات ادغام شد');
  navigate('dashboard');
}

/* ---------- ارسال برنامه به دستگاه دیگر ---------- */
async function shareAppTransfer(withData){
  const htmlTemplate=document.documentElement.outerHTML;
  let finalHtml=htmlTemplate;
  const dataToEmbed=withData ? DEFAULT_STATE_MERGE() : DEFAULT_STATE();
  const declPrefix='const EMBEDDED_STATE = '+'___LB_BOOT'+'_STATE_SENTINEL___;';
  const declReplacement='const EMBEDDED_STATE = '+JSON.stringify(dataToEmbed)+';';
  const lastIdx=finalHtml.lastIndexOf(declPrefix);
  if(lastIdx!==-1) finalHtml=finalHtml.slice(0,lastIdx)+declReplacement+finalHtml.slice(lastIdx+declPrefix.length);
  const bytes=new TextEncoder().encode(finalHtml);
  const fileName=withData?'DENTYAR-انتقال-با-اطلاعات.html':'DENTYAR-انتقال-خالی.html';
  const result=await downloadBlob(bytes,fileName,'text/html;charset=utf-8',{share:true});
  if(result==='shared') toast('فایل انتقالی DENTYAR برای ارسال باز شد');
  else if(result==='saved') toast('فایل انتقالی در Documents/DENTYAR ذخیره شد');
  else if(result==='downloaded') toast('فایل انتقالی آماده دانلود است');
  else if(result==='cancelled') toast('ارسال لغو شد');
  return result;
}

async function exportAppTransfer(withData){
  // Rebuild a full standalone HTML using current DOC as template, embedding (or clearing) state.
  const htmlTemplate = document.documentElement.outerHTML;
  let finalHtml = htmlTemplate;
  const dataToEmbed = withData ? DEFAULT_STATE_MERGE() : DEFAULT_STATE();
  // IMPORTANT: build the search string via concatenation so this exact contiguous
  // substring never appears verbatim in this function's own source text — otherwise
  // String.replace (which matches the FIRST occurrence) would wrongly match itself
  // here instead of the real bootstrap line near the end of the document.
  const declPrefix = 'const EMBEDDED_STATE = ' + '___LB_BOOT' + '_STATE_SENTINEL___;';
  const declReplacement = 'const EMBEDDED_STATE = ' + JSON.stringify(dataToEmbed) + ';';
  const lastIdx = finalHtml.lastIndexOf(declPrefix);
  if(lastIdx !== -1){
    finalHtml = finalHtml.slice(0,lastIdx) + declReplacement + finalHtml.slice(lastIdx+declPrefix.length);
  }
  const bytes = new TextEncoder().encode(finalHtml);
  const result=await downloadBlob(bytes, withData? 'DENTYAR-انتقال-با-اطلاعات.html' : 'DENTYAR-انتقال-خالی.html', 'text/html;charset=utf-8', {share:false});
  toast(result==='saved'?'فایل انتقالی در Documents/DENTYAR ذخیره شد':result==='downloaded'?'فایل انتقالی برای دانلود آماده شد':'فایل انتقالی آماده شد');
}
function DEFAULT_STATE_MERGE(){
  return { meta:STATE.meta, patients:STATE.patients, dentists:STATE.dentists, appointments:STATE.appointments, lists:STATE.lists, backupHistory:[] };
}

function refreshDentyarWeb(){
  try{ if('serviceWorker' in navigator){ navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.update())).catch(()=>{}); } }catch(e){}
  try{ if('caches' in window){ caches.keys().then(keys=>Promise.all(keys.filter(k=>/^dentyar-/i.test(k)).map(k=>caches.delete(k)))).finally(()=>location.replace(location.href.split('#')[0]+'?v='+Date.now())); return; } }catch(e){}
  location.replace(location.href.split('#')[0]+'?v='+Date.now());

function getDentyarPlatform(){
  try{
    if(window.Capacitor && typeof window.Capacitor.isNativePlatform==='function' && window.Capacitor.isNativePlatform()){
      return String(window.Capacitor.getPlatform?.()||'android').toLowerCase();
    }
  }catch(e){}
  const ua=navigator.userAgent||'';
  if(/iPhone|iPad|iPod/i.test(ua)) return 'ios';
  if(/Android/i.test(ua)) return 'android-web';
  if(/Windows/i.test(ua)) return 'windows';
  if(/Macintosh|Mac OS X/i.test(ua)) return 'macos';
  if(/Linux/i.test(ua)) return 'linux';
  return 'web';
}

}
async function checkAndApplyWebUpdate(){
  const badge=document.getElementById('dentyarPlatformBadge');
  if(badge) badge.textContent='در حال بررسی…';
  const manifestUrl='https://raw.githubusercontent.com/dentyar49-code/DENTYAR/main/update.json?ts='+Date.now();
  try{
    const res=await fetch(manifestUrl,{cache:'no-store',headers:{'Accept':'application/json'}});
    if(!res.ok) throw new Error('update manifest '+res.status);
    const remote=await res.json();
    const remoteVersion=String(remote.version||'').toUpperCase();
    const current=String(DENTYAR_APP_VERSION||'V30').toUpperCase();
    if(!remoteVersion){throw new Error('missing version');}
    const num=v=>Number(String(v).replace(/[^0-9]/g,''))||0;
    if(num(remoteVersion)<=num(current)){
      if(badge) badge.textContent=getDentyarPlatform();
      modalAlert('بروزرسانی DENTYAR',`نسخه فعلی ${faDigits(current)} است و بروزرسانی جدیدی منتشر نشده است.`);
      return;
    }
    const ok=confirm(`نسخه ${remoteVersion} آماده است. بروزرسانی وب انجام شود؟`);
    if(!ok) return;
    // The web/PWA update is always applied on the same deployment URL so the clinic data remains local.
    if('serviceWorker' in navigator){
      for(const reg of await navigator.serviceWorker.getRegistrations()){
        try{await reg.update(); if(reg.waiting){reg.waiting.postMessage({type:'SKIP_WAITING'}); await new Promise(r=>setTimeout(r,250));}}catch(e){}
      }
    }
    if('caches' in window){for(const k of await caches.keys()){if(/^dentyar-/i.test(k)) await caches.delete(k);}}
    location.replace(location.href.split('#')[0]+'?v='+Date.now());
  }catch(e){
    console.error('DENTYAR web update check failed',e);
    if(badge) badge.textContent=getDentyarPlatform();
    modalAlert('بروزرسانی DENTYAR','بررسی بروزرسانی انجام نشد. فایل update.json باید در مخزن اصلی DENTYAR قرار داشته باشد و اتصال اینترنت فعال باشد.');
  }
}

async function checkAndInstallAndroidUpdate(){
  const badge=document.getElementById('updateStateBadge');
  if(badge) badge.textContent='در حال بررسی…';
  try{
    const r=await fetch('https://raw.githubusercontent.com/dentyar49-code/DENTYAR/main/update.json?ts='+Date.now(),{cache:'no-store',headers:{'Accept':'application/json'}});
    if(!r.ok) throw new Error('manifest '+r.status);
    const m=await r.json();
    const remoteVersion=String(m.version||m.android?.version||'').toUpperCase();
    const current=String(DENTYAR_APP_VERSION||'V30').toUpperCase();
    const num=v=>Number(String(v).replace(/[^0-9]/g,''))||0;
    if(!remoteVersion || num(remoteVersion)<=num(current)){
      if(badge) badge.textContent='به‌روز';
      modalAlert('بروزرسانی DENTYAR',`نسخه نصب‌شده ${faDigits(current)} است و نسخه جدیدی منتشر نشده است.`);
      return;
    }
    const apkUrl=String(m.android?.apkUrl||m.apkUrl||'').trim();
    if(!apkUrl) throw new Error('missing apkUrl');
    if(!confirm(`نسخه ${remoteVersion} آماده نصب است. دریافت و نصب انجام شود؟`)) return;
    if(badge) badge.textContent='در حال دریافت APK…';
    const ar=await fetch(apkUrl,{cache:'no-store'});
    if(!ar.ok) throw new Error('apk '+ar.status);
    const blob=await ar.blob();
    const fileName=String(m.android?.fileName||('DENTYAR-'+remoteVersion+'.apk')).replace(/[\\/:*?"<>|]/g,'_');
    await new Promise((resolve,reject)=>{
      const req=indexedDB.open('dentyar_updates_v1',1);
      req.onupgradeneeded=e=>{if(!e.target.result.objectStoreNames.contains('updates'))e.target.result.createObjectStore('updates',{keyPath:'id'});};
      req.onerror=()=>reject(req.error||new Error('IDB open failed'));
      req.onsuccess=e=>{
        const db=e.target.result,tx=db.transaction('updates','readwrite');
        tx.objectStore('updates').put({id:'latest',version:remoteVersion,note:m.notes||'',fileName,size:blob.size,blob,savedAt:Date.now()});
        tx.oncomplete=()=>{db.close();resolve();};
        tx.onerror=()=>{db.close();reject(tx.error||new Error('IDB write failed'));};
      };
    });
    if(badge) badge.textContent='نسخه دریافت شد';
    const info=document.getElementById('savedUpdateInfo');
    if(info) info.textContent=`نسخه ${remoteVersion} | ${fileName} | ${Math.round(blob.size/1024)} کیلوبایت`;
    await executeSavedAppUpdate();
  }catch(e){
    console.error('DENTYAR Android update failed',e);
    if(badge) badge.textContent='خطا';
    modalAlert('بروزرسانی Android','دریافت یا نصب خودکار انجام نشد. بررسی کنید اینترنت فعال باشد و آخرین APK در بخش Releases مخزن DENTYAR منتشر شده باشد.');
  }
}

function saveAppUpdatePackage(){
  const input=document.getElementById('updateApkInput');
  const file=input?.files?.[0];
  const version=(document.getElementById('updateVersionInput')?.value||'').trim().toUpperCase();
  const note=(document.getElementById('updateNoteInput')?.value||'').trim();
  if(!file){ modalAlert('بروزرسانی','ابتدا فایل APK نسخه جدید را انتخاب کنید.'); return; }
  if(!/\.apk$/i.test(file.name)){ modalAlert('بروزرسانی','فقط فایل APK مجاز است.'); return; }
  if(!version){ modalAlert('بروزرسانی','شماره نسخه جدید را وارد کنید؛ مانند V30.'); return; }
  const badge=document.getElementById('updateStateBadge');
  badge.textContent='در حال ذخیره…';
  const reader=new FileReader();
  reader.onload=()=>{
    const blob=new Blob([reader.result],{type:'application/vnd.android.package-archive'});
    const req=indexedDB.open('dentyar_updates_v1',1);
    req.onupgradeneeded=e=>{ if(!e.target.result.objectStoreNames.contains('updates')) e.target.result.createObjectStore('updates',{keyPath:'id'}); };
    req.onerror=()=>{ badge.textContent='خطا'; modalAlert('بروزرسانی','ذخیره فایل ممکن نشد.'); };
    req.onsuccess=e=>{
      const db=e.target.result; const tx=db.transaction('updates','readwrite');
      tx.objectStore('updates').put({id:'latest',version,note,fileName:file.name,size:file.size,blob,savedAt:Date.now()});
      tx.oncomplete=()=>{
        badge.textContent='نسخه آماده';
        const info=document.getElementById('savedUpdateInfo');
        info.textContent=`نسخه ${version} | ${file.name} | ${Math.round(file.size/1024)} کیلوبایت${note?' | '+note:''}`;
        toast('فایل بروزرسانی ذخیره شد');
        db.close();
      };
      tx.onerror=()=>{ badge.textContent='خطا'; modalAlert('بروزرسانی','ذخیره فایل انجام نشد.'); db.close(); };
    };
  };
  reader.readAsArrayBuffer(file);
}
async function executeSavedAppUpdate(){
  const req=indexedDB.open('dentyar_updates_v1',1);
  req.onupgradeneeded=e=>{ if(!e.target.result.objectStoreNames.contains('updates')) e.target.result.createObjectStore('updates',{keyPath:'id'}); };
  req.onsuccess=async e=>{
    const db=e.target.result; const tx=db.transaction('updates','readonly');
    tx.objectStore('updates').get('latest').onsuccess=async ev=>{
      const rec=ev.target.result;
      if(!rec){ modalAlert('بروزرسانی','هنوز فایل APK نسخه جدید ذخیره نشده است.'); db.close(); return; }
      try{
        const C=window.Capacitor;
        if(C && C.isNativePlatform && C.isNativePlatform()){
          const fs=C.registerPlugin ? C.registerPlugin('Filesystem') : null;
          const opener=C.registerPlugin ? C.registerPlugin('FileOpener') : null;
          if(!fs || !fs.writeFile) throw new Error('Filesystem unavailable');
          const arr=new Uint8Array(await rec.blob.arrayBuffer());
          let binary=''; const chunk=0x8000;
          for(let p=0;p<arr.length;p+=chunk) binary+=String.fromCharCode.apply(null,arr.subarray(p,p+chunk));
          const data=btoa(binary);
          const safeName=String(rec.fileName||('DENTYAR-'+rec.version+'.apk')).replace(/[\\/:*?"<>|]/g,'_');
          const path='DENTYAR/'+safeName;
          await fs.writeFile({path,data,directory:'CACHE',recursive:true});
          if(fs.getUri && opener && opener.openFile){
            const u=await fs.getUri({path,directory:'CACHE'});
            await opener.openFile({path:String(u.uri||u.path),mimeType:'application/vnd.android.package-archive'});
            toast('نصب بروزرسانی آغاز شد؛ تأیید نهایی با اندروید انجام می‌شود');
          }else{
            toast('APK در حافظه موقت برنامه ذخیره شد؛ اجرای نصب را دوباره بزنید');
          }
        }else{
          const url=URL.createObjectURL(rec.blob);
          const a=document.createElement('a'); a.href=url; a.download=rec.fileName||('DENTYAR-'+rec.version+'.apk'); a.rel='noopener';
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(()=>URL.revokeObjectURL(url),120000);
          toast('فایل APK برای دانلود آماده شد؛ نصب APK فقط در Android انجام می‌شود');
        }
      }catch(err){
        console.error('DENTYAR APK install failed',err);
        modalAlert('نصب بروزرسانی','فایل APK آماده شد، اما اجرای نصب خودکار انجام نشد. دوباره «اجرای نصب Android» را بزنید.');
      }finally{ db.close(); }
    };
  };
}

function renderProfileGate(){

      <div id="profileGateError" style="color:var(--danger);font-size:11.5px;margin-top:8px;height:14px"></div>
      <button class="btn btn-primary btn-block" style="margin-top:10px" onclick="submitProfileGate()">ورود</button>

  `;
  const inp = document.getElementById('profileGateInput');

  inp.addEventListener('keydown', e=>{ if(e.key==='Enter') submitProfileGate(); });
}
function submitProfileGate(){
  const v = toEnDigits(document.getElementById('profileGateInput').value.trim());
  if(v === toEnDigits(STATE.meta.profilePassword)){
    sessionStorage.setItem('lb_profile_unlocked','1');
    renderProfile();
  } else {
    document.getElementById('profileGateError').textContent = 'رمز پروفایل اشتباه است';
  }
}
function lockProfile(){
  sessionStorage.removeItem('lb_profile_unlocked');
  navigate('dashboard');
}
function changeProfilePassword(){
  const v = toEnDigits(document.getElementById('newProfilePassInput').value.trim());
  if(v.length!==8 || !/^\d{8}$/.test(v)){ modalAlert('خطا','رمز پروفایل باید دقیقاً ۸ رقم باشد.'); return; }
  STATE.meta.profilePassword = v;
  saveState();
  toast('رمز پروفایل تغییر کرد');
}
function handleLogoUpload(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    STATE.meta.logoDataUrl = reader.result;
    saveState();
    renderHeader(); renderLock();
    toast('لوگو به‌روزرسانی شد');
    renderProfile();
  };
  reader.readAsDataURL(file);
}
function resetLogo(){
  modalConfirm('بازگشت به لوگوی پیش‌فرض','آیا از حذف لوگوی سفارشی مطمئن هستید؟', ()=>{
    STATE.meta.logoDataUrl = null;
    saveState();
    renderHeader(); renderLock();
    toast('لوگوی پیش‌فرض بازگردانده شد');
    renderProfile();
  });
}

function addListItem(){
  const v = document.getElementById('newListItem').value.trim();
  if(!v) return;
  if(!STATE.lists[settingsActiveList].includes(v)) STATE.lists[settingsActiveList].push(v);
  saveState(); renderSettings();
}
function removeListItem(i){
  modalConfirm('حذف مورد','آیا از حذف این مورد مطمئن هستید؟', ()=>{
    STATE.lists[settingsActiveList].splice(i,1);
    saveState(); renderSettings();
  });
}

}
function submitCreatorGate(){
  const v=toEnDigits((document.getElementById('creatorPassInput')?.value||'').trim());

  speechSynthesis.speak(u);
}

window.addEventListener('DOMContentLoaded', function(){
  loadState();
startDentyarIDBMirror();
  if(EMBEDDED_STATE){
    // Only apply embedded state on very first load of a transferred copy (no existing localStorage yet was already handled by loadState default)
    // If this file was opened as a transfer copy and localStorage is empty/default, seed it.
    const isFreshDefault = STATE.patients.length===0 && STATE.dentists.length===0 && STATE.appointments.length===0 && !localStorage.getItem('lb_seeded_'+APP_KEY);
    if(isFreshDefault){
      STATE = {...DEFAULT_STATE(), ...EMBEDDED_STATE};
      saveState();
      localStorage.setItem('lb_seeded_'+APP_KEY, '1');
    }
  }
  renderLock();
  renderHeader();
  renderBottomNav();
  renderPage();

  if(sessionStorage.getItem('lb_unlocked')==='1'){
    document.getElementById('lockScreen').style.display='none';
  }

  document.getElementById('modalOverlay').addEventListener('click', function(e){
    if(e.target === this) closeModal();
  });

  // PWA: register only when served from HTTPS/localhost (service workers are not allowed on file://).
  if('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
    navigator.serviceWorker.register('./sw.js', {scope:'./'}).then(function(reg){
      if(reg && reg.update) reg.update();
    }).catch(function(err){ console.warn('DENTYAR service worker registration failed:', err); });
  }
  // If no native install prompt is available, keep a visible install action so the user can follow the browser's Add to Home Screen flow.
  if(!isStandaloneMode()){
    const ib=document.getElementById('installAppBtn');
    if(ib && !deferredInstallPrompt) ib.classList.add('show');
  }

  window.addEventListener('resize', syncFixedTopHeight);
});
</script>


<script>
// سراسری: هر متن جدیدی که در رابط کاربری تولید شود نیز با ارقام فارسی نمایش داده می‌شود.
(function(){
  const run=()=>{
    setupV26JalaliDates(document);
    toFaTextNodeTree(document.body);
    formatAllNumericInputs();
    document.querySelectorAll('input[type=text],input[type=tel],input[type=number]').forEach(el=>{
      if(/(Gross|Discount|Insurance|CoverageCeiling|Cash|Card|Transfer|Other|Refund|Price|Amount|Cost|Paid|Balance)/i.test(el.id||'')) el.setAttribute('data-v26-number','1');
    });
  };
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',run,{once:true}); else run();
  const mo=new MutationObserver(()=>run());
  mo.observe(document.body,{subtree:true,childList:true,characterData:true});
  
  document.addEventListener('input',e=>{
    const el=e.target;
    if(!el || !el.matches) return;
    if(el.matches('input[type=tel],input[inputmode=numeric],input[type=number]')){
      const pos=el.selectionStart;
      const converted=faDigits(toEnDigits(el.value));
      if(converted!==el.value){ el.value=converted; try{el.setSelectionRange(pos,pos);}catch(_){} }
    }
  },true);
document.addEventListener('blur',e=>{
    const el=e.target;
    if(el && el.matches && el.matches('input[data-v26-number]') && el.value.trim()) el.value=faDigits(toEnDigits(el.value));
  },true);
})();
</script>
